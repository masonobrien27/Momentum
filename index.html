 DIALED 3.0 - personal progress, local-first.

*/
const STORAGE_KEY = 'dialed.workspace.v3';
const LEGACY_KEY = 'momentum.prototype.v1';
const PREVIOUS_KEY = 'dialed.before-replace.v3';
const DATA_VERSION = 3;
const STUDY_WEEKS = 13;
const GYM_SPLITS = [['push','Push'],['pull','Pull'],['legs','Legs']];
function emptyStudyWeeks() { return Array.from({length:STUDY_WEEKS},()=>({lecture:false,tutorial:false})); }
function normaliseStudyWeeks(value) {
 // Version 1 did not have a weekly checklist. Old records start unchecked.
 if(value===undefined)return emptyStudyWeeks();
 if(!Array.isArray(value)||value.length!==STUDY_WEEKS)throw new Error('A subject must have 13 study weeks.');
 return Array.from(value,w=>{
  if(!w||typeof w!=='object'||typeof w.lecture!=='boolean'||typeof w.tutorial!=='boolean')throw new Error('Invalid lecture or tutorial checkbox data.');
  return {lecture:w.lecture,tutorial:w.tutorial};
 });
}
function gymSplitLabel(split) { return GYM_SPLITS.find(([id])=>id===split)?.[1] || 'Not specified'; }
function studyStats(course) {
 const weeks=course.weeklyProgress;
 const lectures=weeks.filter(w=>w.lecture).length,tutorials=weeks.filter(w=>w.tutorial).length,complete=weeks.filter(w=>w.lecture&&w.tutorial).length;
 return {lectures,tutorials,complete,tasks:lectures+tutorials,percent:(lectures+tutorials)/(STUDY_WEEKS*2)*100};
}
function gymSplitCounts(week) {
 const counts={push:0,pull:0,legs:0,unspecified:0};
 for(const r of data().workouts)if(r.type==='gym'&&r.date>=week&&r.date<=addDays(week,6)&&r.date<=today())counts[r.split||'unspecified']++;
 return counts;
}

function monthlyPace(latest,deadline,target) {

 const [fy,fm]=latest.month.split('-').map(Number),[ty,tm]=deadline.split('-').map(Number),months=(ty-fy)*12+tm-fm;

}

function navigate(page,courseId='',tab='weeks') {

function upsert(kind,entry,key,id='') {
 const list=data()[kind],same=list.find(r=>r[key]===entry[key]&&r.id!==id);
 // Editing to a date/month already occupied must not silently erase another record.
 if(id&&same)throw new Error('There is already an entry for that date or period. Edit that entry instead.');
 if(id){const index=list.findIndex(r=>r.id===id);if(index<0)throw new Error('The entry could not be found.');list[index]={...entry,id};return;}
 if(same)Object.assign(same,entry,{id:same.id});else list.push({...entry,id:uid()});
}

   const id=get('id');if(id){const index=data().workouts.findIndex(r=>r.id===id);if(index<0)throw new Error('Workout not found.');data().workouts[index]={...entry,id};}else data().workouts.push({...entry,id:uid()});selectedWeek=weekStart(entry.date);message=entry.split?`${gymSplitLabel(entry.split)} session saved. Showing up counts.`:'Session saved. Showing up counts.';
  }
  else if(kind==='steps'){const entry={week:weekStart(readingDate(get('week'))),value:n('value',0,100000,'Average daily steps',true)};upsert('steps',entry,'week',get('id'));selectedWeek=entry.week;message='Weekly steps saved.';}
  else if(kind==='dailySteps'){const entry={date:readingDate(get('date')),value:n('value',0,100000,'Daily steps',true)};upsert('dailySteps',entry,'date',get('id'));selectedWeek=weekStart(entry.date);message='Daily steps saved. Weekly average updated.';}
  else if(kind==='spending'){
   const entry={week:weekStart(readingDate(get('week'))),amount:Math.round(n('amount',0,100000000,'Weekly spend')*100)/100,budget:get('budget')===''?null:Math.round(n('budget',.01,100000000,'Weekly budget')*100)/100,note:get('note').trim().slice(0,200)};upsert('spending',entry,'week',get('id'));moneyWeek=entry.week;message='Weekly spend saved. Savings are unchanged.';

 </div>${tasks.length?`<div class="priority-list" style="margin-top:18px">${priorityRows(tasks,'daily')}</div>`:''}
 <div class="focus-footer"><span>${icon('flame')} Show up. Stack the days.</span>${button('+ Priority','priority-form','','link-btn')}</div></section>${renderWeekPanel()}</div>
 <div class="streak-grid">${[['gym','Gym consistency'],['cardio','Cardio consistency'],['steps','Step consistency']].map(([type,label])=>{const n=streak(type);return `<div class="streak-cell">${icon('flame')}<div><strong>${n} week${n===1?'':'s'}</strong><small>${label}</small></div></div>`;}).join('')}</div>
 <div class="meta" style="font-size:10px;margin:8px 3px">Streaks reflect recorded weeks, not perfection. Training targets are weekly. Rest days are not treated as missed daily goals.</div>`;
}
function spendingChart() {
 const week=weekStart(today()), rows=Array.from({length:8},(_,i)=>{const w=addDays(week,(i-7)*7);return {week:w,...spendStats(w)};}), max=Math.max(1,...rows.map(r=>r.entry?.amount||0));
 return `<div class="money-chart-bars" role="img" aria-label="Eight weeks of recorded spending; unfilled bars mean no record"><span class="sr-only">${rows.map(r=>`${weekLabel(r.week)}: ${r.entry?money(r.entry.amount,true):'not logged'}`).join('. ')}</span>${rows.map(r=>`<div class="spend-bar-col"><span class="bar-amount">${r.entry?money(r.entry.amount):'--'}</span><div class="spend-bar ${!r.entry?'empty':r.left!==null&&r.left<0?'over':r.week===week?'current':''}" ${r.entry?`style="height:${Math.max(4,r.entry.amount/max*115)}px"`:''}></div><time>${fmtDate(r.week)}</time></div>`).join('')}</div>`;
}
function renderSpendingHistory() {
 const rows=sorted(data().spending,'week').reverse();
 return `<section class="card money-history"><div class="card-head"><h2>Weekly spending history</h2>${button('+ Add week','log-spending','','link-btn')}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Week</th><th>Spent</th><th>Budget at check-in</th><th>Remaining</th><th>Edit</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${fmtDate(r.week,{day:'numeric',month:'short',year:'numeric'})}</strong><small>${weekLabel(r.week)}${r.note?` &middot; ${esc(r.note)}`:''}</small></td><td>${money(r.amount,true)}</td><td>${r.budget===null?'Not set':money(r.budget,true)}</td><td class="${r.budget!==null&&r.amount>r.budget?'negative':''}">${r.budget===null?'--':r.amount>r.budget?`${money(r.amount-r.budget,true)} over`:money(r.budget-r.amount,true)}</td><td>${button(icon('edit'),'log-spending',`data-id="${esc(r.id)}" aria-label="Edit spend for ${esc(r.week)}"`,'icon-btn')}${button(icon('trash'),'delete-entry',`data-kind="spending" data-id="${esc(r.id)}" aria-label="Delete spend for ${esc(r.week)}"`,'icon-btn')}</td></tr>`).join('')}</tbody></table></div>`:`<div style="padding:0 24px 23px">${emptyState('Track the week, not another daily check.','Enter your total spend once a week, or update the same week as you go.','','wallet')}</div>`}</section>`;
}
function openDailySteps(id='') {
 const r=data().dailySteps.find(x=>x.id===id);
 openModal(r?'Update daily steps.':'Log today\'s steps.','HEALTH / DAILY TOTAL',formStart('dailySteps',hidden('id',id))+`<div class="form-grid">${field('Daily steps','value','number',r?.value??'','required min="0" max="100000" step="1" inputmode="numeric" placeholder="e.g. 10420"')}${field('Date','date','date',r?.date??today(),`required min="1900-01-01" max="${today()}"`)}</div><p class="code-note">Enter the total for that day, not extra steps to add. Saving the same date updates it. Weekly averages use logged days only; missing days are not treated as zero. A manual weekly average takes priority over daily readings.</p>`+formEnd(r?'Update steps':'Save steps'));
}
function openSpending(id='',week='') {
 const chosen=week || (currentPage==='money'?moneyWeek:weekStart(today()));
 if(!validDate(chosen)||chosen>today()){toast('Spending can only be recorded for this week or an earlier week.');return;}
 const r=data().spending.find(x=>x.id===id) || (!id?data().spending.find(x=>x.week===weekStart(chosen)):null);
 const recordId=r?.id||'';
 openModal(r?'Update weekly spend.':'Log weekly spend.','MONEY / MONDAY TO SUNDAY',formStart('spending',hidden('id',recordId))+`<div class="info-box">Enter your <strong>total spending for the week</strong>, not your savings balance. Updating a week replaces its total; it does not add a second amount.</div><div class="form-grid">${field('Total spent (AUD)','amount','number',r?.amount??'','required min="0" max="100000000" step="0.01" inputmode="decimal" placeholder="e.g. 245.50"')}${field('Week containing this date','week','date',r?.week??weekStart(chosen),`required min="1900-01-01" max="${today()}"`)}${field('Weekly budget (optional, AUD)','budget','number',r?r.budget??'':data().settings.weeklyBudget??'','min="0.01" max="100000000" step="0.01" inputmode="decimal" placeholder="Set your own limit"','Stored with this week. No budget is assumed.',true)}<div class="form-field full"><label for="f-note">Note (optional)</label><input id="f-note" name="note" maxlength="200" value="${esc(r?.note??'')}" placeholder="e.g. Food, transport, going out"></div></div><p class="code-note">Monday-Sunday weeks. Current-week totals can be updated as you go. This does not subtract from your savings balance and is not linked to a bank account.</p>`+formEnd(r?'Update weekly spend':'Save weekly spend'));
}
function openPriority(id='') {
 const r=data().priorities.find(p=>p.id===id);
 openModal(r?'Edit your priority.':'Set your next priority.','FOCUS / YOUR PLAN',formStart('priority',hidden('id',id))+`<div class="form-grid">${field('Priority','title','text',r?.title??'','required maxlength="160" placeholder="e.g. Complete Fluid Mechanics tutorial"','',true)}${field('Date','date','date',r?.date??today(),'required min="1900-01-01" max="2200-12-31"')}${selectField('Category','category',[['University','University'],['Training','Training'],['Money','Money'],['Personal','Personal']],r?.category??'University')}</div><label class="check-field"><input type="checkbox" name="done" ${r?.done?'checked':''}><span>Completed</span></label><p class="code-note">Your dated priorities appear on Today and in the weekly plan. These checkboxes are separate from your subject's 13-week lecture and tutorial checklists.</p>`+formEnd(r?'Save priority':'Add priority',r?button('Delete','delete-entry',`data-kind="priorities" data-id="${esc(r.id)}"`,'btn small danger'):''));
}
function updatePriorityCheck(input) {
 if(syncBlocked){input.checked=!input.checked;toast('Reload to load the latest changes from your other tab.');return;}
 const p=data().priorities.find(p=>p.id===input.dataset.id);if(!p)return;
 p.done=input.checked;const id=input.id,scroll=window.scrollY;commit(p.done?'Priority complete. Stay Dialed.':'Priority marked as to do.');document.getElementById(id)?.focus({preventScroll:true});window.scrollTo({top:scroll,behavior:'instant'});
}
function openAssessmentDetail(cid,id) {
 const c=data().courses.find(c=>c.id===cid),a=c?.assessments.find(a=>a.id===id);if(!a)return;
 openModal(a.name,c.name,`<div class="info-box"><strong>${a.date?fmtDate(a.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Date not set'}</strong><br>${num(a.weight)}% of course &middot; Target ${pct(a.target)}${a.result!==null?`<br>Result: <strong>${pct(a.result)}</strong>`:''}</div><div class="button-row">${button(a.submitted?'Mark not completed':'Mark completed / submitted','toggle-assessment',`data-course="${esc(c.id)}" data-id="${esc(a.id)}"`,'btn')}${button('Enter result','log-result',`data-course="${esc(c.id)}" data-id="${esc(a.id)}"`,'btn primary')}${button('Edit assessment','assessment-form',`data-course="${esc(c.id)}" data-id="${esc(a.id)}"`,'btn')}${button('Open subject','open-subject',`data-course="${esc(c.id)}"`,'btn')}</div><p class="code-note">Completing or submitting an assessment removes its deadline from the pending list. It does not invent a mark or change grade calculations. Dates imported from the whiteboard should be checked against your unit outline.</p>`);
}

function renderMoney() {
 const weekNav=`<div class="week-nav">${button(icon('arrow','back-arrow'),'money-week','data-delta="-7" aria-label="Previous spending week"','icon-btn')}<span class="meta">${weekLabel(moneyWeek)}</span>${button(icon('arrow'),'money-week',`data-delta="7" aria-label="Next spending week" ${moneyWeek>=weekStart(today())?'disabled':''}`,'icon-btn')}</div>`;
 return pageHeading('MONEY / WEEKLY CONTROL','Know where it goes.','Weekly spend up front. Long-term savings kept separate.',button('Edit budget','settings','','btn small'))+`<div class="money-week-grid">${renderSpendCard(moneyWeek)}<section class="card chart-card"><div class="card-head"><h2>Your spending rhythm</h2>${weekNav}</div><div class="meta">Last 8 calendar weeks. Blank bars mean not logged, not zero.</div>${spendingChart()}<p class="budget-tip">Record one total per week and update it as needed. Your budget is saved with each check-in; changing the default does not rewrite old weeks.</p></section></div>${renderSpendingHistory()}`+renderSavingsSection();
}

document.addEventListener('click',event=>{const action=event.target.closest('[data-action]');if(action){event.preventDefault();handleAction(action);return;}const nav=event.target.closest('a[href^="#"]');if(nav&&['today','university','health','money'].includes(nav.hash.slice(1))){event.preventDefault();navigate(nav.hash.slice(1));}});
document.addEventListener('submit',event=>{const form=event.target.closest('form[data-form]');if(form){event.preventDefault();submitForm(form);}});
document.addEventListener('input',event=>{if(event.target.closest('form[data-form="result"]'))syncResultPreview();if(event.target.closest('form[data-form="steps"]'))syncStepPeriod();});
document.addEventListener('change',event=>{
 if(event.target.matches('[data-priority-check]')){updatePriorityCheck(event.target);return;}
 if(event.target.matches('[data-study-check]')){updateStudyCheck(event.target);return;}
 if(event.target.id==='subject-switch'){navigate('university',event.target.value,courseTab);return;}
 if(event.target.id==='health-week'){if(validDate(event.target.value)&&event.target.value<=today()){selectedWeek=weekStart(event.target.value);render();}else {toast('Choose a valid week no later than this week.');event.target.value=selectedWeek;}return;}
 const form=event.target.closest('form[data-form]');if(!form)return;
 if(form.dataset.form==='workout')syncWorkoutForm();
 if(form.dataset.form==='steps')syncStepPeriod();
 if(form.dataset.form==='result'){
  if(event.target.name==='course'){const c=data().courses.find(c=>c.id===event.target.value);form.elements.assessment.innerHTML=c.assessments.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');syncResultFields();}
  if(event.target.name==='assessment')syncResultFields();
 }
});
$('#import-file').addEventListener('change',event=>receiveImport(event.target.files[0]));
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const rect=$('#modal').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
$('#modal').addEventListener('close',()=>{if(modalReturnFocus?.isConnected)modalReturnFocus.focus({preventScroll:true});else $('#main').focus({preventScroll:true});});
window.addEventListener('hashchange',()=>{readRoute();render();});
window.addEventListener('popstate',()=>{readRoute();render();});
window.addEventListener('storage',event=>{
 if(event.key!==STORAGE_KEY&&event.key!==null)return;
 syncBlocked=true;loadWarning='Your records changed in another tab or site storage was cleared. Reload before making edits to avoid replacing newer data.';shell();toast('Data changed elsewhere. Reload before editing.');
});
let lastVisibleDate=today();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&today()!==lastVisibleDate){lastVisibleDate=today();homeWeek=weekStart(today());moneyWeek=homeWeek;selectedWeek=homeWeek;render();}});
setInterval(()=>{if(today()!==lastVisibleDate&&!$('#modal').open){lastVisibleDate=today();homeWeek=weekStart(today());moneyWeek=homeWeek;selectedWeek=homeWeek;render();}},60000);
if(recoveryRaw===null)persist();
render();
if(migrated&&storageAvailable)setTimeout(()=>toast('Your personal Momentum progress is now in Dialed.'),300);

</script>
</body>
</html>
