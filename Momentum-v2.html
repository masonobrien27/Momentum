 if(!latest||!deadline)return null;

  const clean=normaliseData(raw.data),maxDate=store.mode==='demo'?DEMO_TODAY:localDate();
  if(clean.weights.some(r=>r.date>maxDate)||clean.workouts.some(r=>r.date>maxDate)||clean.steps.some(r=>r.week>weekStart(maxDate))||clean.savings.some(r=>r.month>maxDate.slice(0,7)))throw new Error('This backup includes progress after this workspace date. Switch to your personal workspace for current entries.');
  pendingImport=clean;openModal('Replace this workspace?','IMPORT / PLEASE CONFIRM',`<div class="info-box amber">This backup contains <strong>${clean.courses.length} subjects</strong> and <strong>${dataCount(clean)} results, entries or completed study tasks</strong>. Importing replaces the current <strong>${store.mode==='demo'?'demo':'personal'} workspace</strong>, including its goals. Your other workspace is not changed.</div><p class="code-note">Export the current workspace first to keep a copy. The backup includes personal information and is not encrypted.</p><div class="form-footer">${button('Export current','export','','btn')}${button('Cancel','close-modal','','btn')}${button('Replace workspace','confirm-import','','btn primary')}</div>`);
 }catch(error){toast(error.message||'That backup could not be read. Your existing data has not changed.');}
}
function handleAction(el) {
 const a=el.dataset.action,id=el.dataset.id||'',cid=el.dataset.course||'';
 if(a==='navigate')navigate(el.dataset.page);
 else if(a==='quicklog')openQuicklog();
 else if(a==='close-modal')closeModal();
 else if(a==='log-weight')openWeight(id);
 else if(a==='log-workout')openWorkout('gym',id);
 else if(a==='log-swim')openWorkout('swim',id);
 else if(a==='log-run')openWorkout('run',id);
 else if(a==='log-steps')openSteps(id);
 else if(a==='log-savings')openSavings(id);
 else if(a==='log-result')openResult(cid,id);
 else if(a==='settings')openSettings();
 else if(a==='backup')openBackup();
 else if(a==='start-personal')openStartPersonal();
 else if(a==='confirm-personal'){store.mode='personal';selectedWeek=weekStart(today());closeModal();commit('Your workspace is ready.');}
 else if(a==='switch-demo'){store.mode='demo';selectedWeek=weekStart(today());closeModal();commit('Demo mode. Sample data is clearly labelled.');}
 else if(a==='select-course')navigate('university',id,el.dataset.tab||'weeks');
 else if(a==='course-tab')navigate('university',selectedCourse,id);
 else if(a==='course-form')openCourse(id);
 else if(a==='assessment-form')openAssessment(cid,id);
 else if(a==='health-tab'){healthTab=id;render();}
 else if(a==='open-uni-close'){closeModal();navigate('university');}
 else if(a==='clear-result'){
  const f=$('form[data-form="result"]'),c=data().courses.find(c=>c.id===f?.elements.course.value),r=c?.assessments.find(a=>a.id===f?.elements.assessment.value);if(r?.result!==null&&r)confirmDelete('Clear this result?',`${r.name} will return to ungraded. The assessment, its weighting and target will stay.`,()=>Object.assign(r,{result:null,rawScore:null,rawTotal:null}));else toast('There is no result to clear.');
 }
 else if(a==='delete-entry'){
  const kind=el.dataset.kind;if(!['weights','steps','workouts','savings'].includes(kind))return;
  confirmDelete('Remove this entry?','This removes the selected entry from this workspace and updates its charts. This action cannot be undone.',()=>{data()[kind]=data()[kind].filter(r=>r.id!==id);});
 }
 else if(a==='delete-assessment'){
  const c=data().courses.find(c=>c.id===cid),r=c?.assessments.find(a=>a.id===id);if(!r)return;confirmDelete('Delete this assessment?',`${r.name} and any saved result will be removed. Course forecasts pause if weights no longer total 100%.`,()=>{c.assessments=c.assessments.filter(a=>a.id!==id);});
 }
 else if(a==='delete-course'){
  const c=data().courses.find(c=>c.id===id);if(!c)return;confirmDelete('Delete this subject?',`${c.name}, its 13-week checklist, all its assessments and all its results will be removed from this workspace.`,()=>{data().courses=data().courses.filter(c=>c.id!==id);});
 }
 else if(a==='confirm-delete'){if(pendingDelete){pendingDelete();pendingDelete=null;closeModal();commit('Removed. Your progress has been recalculated.');}}
 else if(a==='reset-workspace'){
  const mode=store.mode;confirmDelete(mode==='demo'?'Reset the sample data?':'Reset your personal workspace?',mode==='demo'?'This restores the original demo entries and whiteboard goals. Your personal workspace is not changed.':'This permanently removes your personal entries, results and goal edits, restoring the original whiteboard plan with blank results. Export a backup first.',()=>{store[mode]=seed(mode==='demo');recoveryRaw=null;loadWarning='';selectedCourse='fluids';selectedWeek=weekStart(today());});
 }
 else if(a==='export'){downloadJSON({format:'momentum-workspace',version:DATA_VERSION,exportedAt:new Date().toISOString(),source:store.mode,data:clone(data())},`momentum-${store.mode}-${localDate()}.json`);toast('Backup prepared. Keep it somewhere private.');}
 else if(a==='export-recovery'&&recoveryRaw!==null)downloadJSON(recoveryRaw,`momentum-recovery-${localDate()}.json`);
 else if(a==='import'){$('#import-file').value='';$('#import-file').click();}
 else if(a==='confirm-import'&&pendingImport){store[store.mode]=pendingImport;pendingImport=null;recoveryRaw=null;loadWarning='';selectedCourse=data().courses[0]?.id||'';selectedWeek=weekStart(today());closeModal();commit('Backup imported. This workspace has been replaced.');}
}
document.addEventListener('click',event=>{const action=event.target.closest('[data-action]');if(action){event.preventDefault();handleAction(action);return;}const nav=event.target.closest('a[href^="#"]');if(nav&&['today','university','health','money'].includes(nav.hash.slice(1))){event.preventDefault();navigate(nav.hash.slice(1));}});
document.addEventListener('submit',event=>{const form=event.target.closest('form[data-form]');if(form){event.preventDefault();submitForm(form);}});
document.addEventListener('input',event=>{if(event.target.closest('form[data-form="result"]'))syncResultPreview();if(event.target.closest('form[data-form="steps"]'))syncStepPeriod();});
document.addEventListener('change',event=>{
 if(event.target.matches('[data-study-check]')){updateStudyCheck(event.target);return;}
 if(event.target.id==='subject-switch'){navigate('university',event.target.value,courseTab);return;}
 if(event.target.id==='health-week'){if(validDate(event.target.value)&&event.target.value<=today()){selectedWeek=weekStart(event.target.value);render();}else {toast('Choose a valid week no later than this week.');event.target.value=selectedWeek;}return;}
 const form=event.target.closest('form[data-form]');if(!form)return;
 if(form.dataset.form==='workout')syncWorkoutForm();
 if(form.dataset.form==='steps')syncStepPeriod();
 if(form.dataset.form==='result'){
  if(event.target.name==='course'){const c=data().courses.find(c=>c.id===event.target.value);form.elements.assessment.innerHTML=c.assessments.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');syncResultFields();}
  if(event.target.name==='assessment')syncResultFields();
 }
});
$('#import-file').addEventListener('change',event=>receiveImport(event.target.files[0]));
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const rect=$('#modal').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();}});
$('#modal').addEventListener('close',()=>{if(modalReturnFocus?.isConnected)modalReturnFocus.focus({preventScroll:true});else $('#main').focus({preventScroll:true});});
window.addEventListener('hashchange',()=>{readRoute();render();});
window.addEventListener('popstate',()=>{readRoute();render();});
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue){toast('This workspace changed in another tab. Reload before making further edits.');}});
if(recoveryRaw===null)persist();
render();
</script>
</body>
</html>
